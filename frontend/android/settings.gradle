
pluginManagement {
    includeBuild("../node_modules/@react-native/gradle-plugin")
}

plugins {
    id("com.facebook.react.settings")
}

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
    ex.autolinkLibrariesFromCommand()
}

rootProject.name = 'SmartNailScan'

include ':app'

includeBuild('../node_modules/@react-native/gradle-plugin')

// Explicitly include Nitro Image for VisionCamera
include ':react-native-nitro-image'
project(':react-native-nitro-image').projectDir =
    new File(rootProject.projectDir, '../node_modules/react-native-nitro-image/android')
